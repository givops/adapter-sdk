name: Public SDK verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B --no-transfer-progress clean install
      - run: mvn -B --no-transfer-progress -f examples/example-ticketing/pom.xml clean verify
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-adapter-sdk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
